name: Build Linux Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Needed by the Release Asset step to attach the .deb on tags.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libibus-1.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-bin curl

      - name: Build and test
        run: |
          ./gtv.sh build

      - name: Compute version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          echo "APP_VERSION=${VER}-1" >> "$GITHUB_ENV"
          echo "deb version: ${VER}-1"

      - name: Package .deb
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          make package VERSION="$APP_VERSION"
          ls -la gotiengviet_*.deb

      - name: Upload Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: gotiengviet-deb
          path: gotiengviet_*.deb

      - name: Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gotiengviet_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
