name: Build Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkg-config

      - name: Run Test Suite
        run: |
          make vet && make test

      - name: Build gotiengviet.exe
        run: |
          make -f Makefile.win

      - name: Bundle Portable Package with Runtime DLLs
        run: |
          mkdir -p release-pkg
          cp build/win/gotiengviet.exe release-pkg/
          # Copy required MinGW runtime DLLs
          cp /mingw64/bin/libglib-2.0-0.dll release-pkg/
          cp /mingw64/bin/libintl-8.dll release-pkg/ 2>/dev/null || true
          cp /mingw64/bin/libpcre2-8-0.dll release-pkg/ 2>/dev/null || true
          cp /mingw64/bin/libwinpthread-1.dll release-pkg/ 2>/dev/null || true
          cp /mingw64/bin/libiconv-2.dll release-pkg/ 2>/dev/null || true
          cp README.md release-pkg/
          cd release-pkg && zip -r ../gotiengviet-windows-x64.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotiengviet-windows-x64
          path: gotiengviet-windows-x64.zip

      - name: Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gotiengviet-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
