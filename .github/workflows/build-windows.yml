name: Build Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    # Needed by the Release Asset step (softprops/action-gh-release)
    # to create the tag release and upload the setup exe.
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkg-config

      - name: Run Test Suite
        run: |
          make -f Makefile.win test

      - name: Build gotiengviet.exe
        run: |
          make -f Makefile.win

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="$(sed -n 's/^#define GTV_VERSION "\(.*\)"/\1/p' windows/version.h)"
            [ -n "$VER" ] || VER="0.5.1"
          fi
          VERNUM="$(echo "$VER" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/').0"
          case "$VERNUM" in
            [0-9]*.[0-9]*.[0-9]*.[0-9]*) ;;
            *) VERNUM="0.0.0.0" ;;
          esac
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "APP_VERNUM=$VERNUM" >> "$GITHUB_ENV"
          echo "version: $VER ($VERNUM)"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Stage installer tree
        run: |
          make -f Makefile.win staging

      - name: Build versioned installer
        # Native ISCC must receive /Q /D... literally: exclude all args
        # from msys2's automatic POSIX->Windows path conversion.
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /Q "/DAppVersion=$APP_VERSION" "/DAppVerNum=$APP_VERNUM" "/DSourceDir=..\\release-pkg" windows/installer.iss
          ls -la gotiengviet-*-x64-setup.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotiengviet-windows-setup
          path: gotiengviet-*-x64-setup.exe

      - name: Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gotiengviet-*-x64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
