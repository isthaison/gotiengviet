name: Build Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkg-config

      - name: Run Test Suite
        run: |
          make -f Makefile.win test

      - name: Build gotiengviet.exe
        run: |
          make -f Makefile.win

      - name: Bundle Portable Package with Runtime DLLs
        run: |
          mkdir -p release-pkg
          cp build/win/gotiengviet.exe release-pkg/
          # Bundle the full MinGW dependency closure, including GIO/GObject.
          changed=1
          while [ "$changed" = 1 ]; do
            changed=0
            for binary in release-pkg/*.exe release-pkg/*.dll; do
              [ -f "$binary" ] || continue
              while IFS= read -r dll; do
                if [ -f "/mingw64/bin/$dll" ] && [ ! -f "release-pkg/$dll" ]; then
                  cp "/mingw64/bin/$dll" release-pkg/
                  changed=1
                fi
              done < <(objdump -p "$binary" | awk '/DLL Name:/ {print $3}')
            done
          done
          cp README.md release-pkg/
          mkdir -p release-pkg/data
          cp data/macros.txt data/emojis.txt data/config data/ai.conf data/assistant.conf data/prompts.conf data/learned-corrections.txt data/learned-words.txt release-pkg/data/
          cd release-pkg && zip -r ../gotiengviet-windows-x64.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotiengviet-windows-x64
          path: gotiengviet-windows-x64.zip

      - name: Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gotiengviet-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
