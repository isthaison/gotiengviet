name: Build Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkg-config

      - name: Run Test Suite
        shell: msys2 {0}
        run: |
          make -f Makefile.win test

      - name: Build gotiengviet.exe
        shell: msys2 {0}
        run: |
          make -f Makefile.win

      - name: Compute version
        shell: msys2 {0}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="$(sed -n 's/^#define GTV_VERSION "\(.*\)"/\1/p' windows/version.h)"
            [ -n "$VER" ] || VER="0.8.5"
          fi
          VERNUM="$(echo "$VER" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/').0"
          case "$VERNUM" in
            [0-9]*.[0-9]*.[0-9]*.[0-9]*) ;;
            *) VERNUM="0.0.0.0" ;;
          esac
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "APP_VERNUM=$VERNUM" >> "$GITHUB_ENV"
          echo "version: $VER ($VERNUM)"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Stage installer tree
        shell: msys2 {0}
        run: |
          make -f Makefile.win staging

      - name: Build versioned installer (unsigned)
        shell: msys2 {0}
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /Q "/DAppVersion=$APP_VERSION" "/DAppVerNum=$APP_VERNUM" "/DSourceDir=..\\release-pkg" windows/installer.iss
          ls -la gotiengviet-*-x64-setup.exe

      # ── SignPath code signing ──────────────────────────────────────
      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: gotiengviet-windows-unsigned
          path: gotiengviet-*-x64-setup.exe
          if-no-files-found: error

      - name: Sign via SignPath
        id: signpath
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'GoTiengViet'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-installer'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

      # ── Upload final artifacts ─────────────────────────────────────
      - name: Upload signed artifact (SignPath)
        if: steps.signpath.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gotiengviet-windows-setup
          path: signed-installer/
          if-no-files-found: error

      - name: Upload unsigned artifact (fallback)
        if: steps.signpath.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gotiengviet-windows-setup
          path: gotiengviet-*-x64-setup.exe
          if-no-files-found: error

      # ── Release (on tag) ───────────────────────────────────────────
      - name: Release Asset (on Tag, signed)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signpath.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: signed-installer/gotiengviet-*-x64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Asset (on Tag, unsigned fallback)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signpath.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: gotiengviet-*-x64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
