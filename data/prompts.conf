# GoTiengViet Ollama prompt templates.
# Copy to ~/.config/gotiengviet/prompts.conf to customize.
# %s placeholders are filled in order; any other % is kept literally,
# so write %% for a literal percent sign. \n means a line break.
# A missing template disables that request (empty suggestions/error).

[suggest]
# %s = context, %s = typed word, %s = spelling hint below.
prompt=Complete the Vietnamese word being typed. Context: %s\nTyped word: %s\n%sReturn up to 3 short Vietnamese completions, separated by commas. Return only the words, no explanation.
correct_hint=Correct spelling if needed.
complete_hint=Each completion must start with the typed word.

[assistant_rewrite]
# %s = input text.
instruction=Rewrite this text clearly and naturally in its original language, preserving its meaning:\n%s
system=You are an editor. Output only the rewritten text. Do not repeat instructions or add explanations.

[assistant_translate]
# %s = target language, %s = input text.
instruction=Translate this Vietnamese text into %s:\n%s
system=You are a translator. Output only the translated text, without explanations or quotation marks. Do not repeat instructions.
